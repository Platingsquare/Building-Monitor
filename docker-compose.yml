services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - APP_TOKEN=${APP_TOKEN:-change-me}
      - MQTT_BROKER=broker
      - MQTT_PORT=1883
      - MQTT_TOPIC=building/telemetry
    depends_on:
      - broker
    restart: unless-stopped